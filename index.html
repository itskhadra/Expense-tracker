
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Expense Tracker</h1>
        <p>Track your expenses in different currencies.</p>
    </header>

    <main>
        <!-- Form for adding expenses -->
        <section>
            <h2>Add Expense</h2>

            <form id="expense-form">
                <label for="description">Description</label>
                <input type="text" id="description" required
                    placeholder="Enter expense description">

                <label for="amount">Amount</label>
                <input type="number" id="amount" min="0.01"
                    step="0.01" required placeholder="Enter amount">

                <label for="currency">Currency</label>
                <select id="currency" required>
                    <option value="KES">KES</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                </select>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Expense</button>
            </form>
        </section>

        <!-- Total and home currency -->
        <section>
            <h2>Total Expenses</h2>

            <label for="home-currency">Home Currency</label>
            <select id="home-currency">
                <option value="KES">KES</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>

            <p id="total-amount">KES 0.00</p>
        </section>

        <!-- List of expenses -->
        <section>
            <h2>My Expenses</h2>

            <label for="category-filter">Filter by category</label>
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <p id="loading-message" role="status" hidden>
                Loading exchange rates...
            </p>

            <p id="error-message" role="alert" hidden></p>

            <p id="empty-message" hidden>
                No expenses added yet.
            </p>

            <div id="expense-list"></div>
        </section>
    </main>

    <script type="module" src="src/main.js"></script>
</body>
</html>
